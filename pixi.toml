[workspace]
authors = ["Brian Rogoff <brogoff@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "proptest"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# `pixi run test [FILES]`: every tests/test_*.mojo, or the given files
test = "bash tests/run_all.sh"
examples = "bash examples/run_all.sh"
package = "mkdir -p build && mojo precompile proptest -o build/proptest.mojoc"
format = "mojo format proptest tests examples extras tools"
# NuMojo strategies (extras/proptest_numojo); see extras/run_tests.sh
test-numojo = "bash extras/run_tests.sh"

# Regenerate the Unicode tables in proptest/internal/ (see tools/gen_unicode.mojo)
[tasks.gen-unicode]
env = { UNICODE_VERSION = "17.0.0" }
cmd = "mkdir -p build/ucd && curl -fsSL -o build/ucd/UnicodeData.txt https://www.unicode.org/Public/$UNICODE_VERSION/ucd/UnicodeData.txt && curl -fsSL -o build/ucd/CaseFolding.txt https://www.unicode.org/Public/$UNICODE_VERSION/ucd/CaseFolding.txt && mojo run tools/gen_unicode.mojo build/ucd && mojo format --quiet proptest/internal/charmap_data.mojo proptest/internal/decomposition_data.mojo"

[dependencies]
mojo = ">=1.3.0.dev2026110305,<2"
