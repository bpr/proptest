[workspace]
authors = ["Brian Rogoff <brogoff@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "proptest"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# `pixi run test [FILES]`: every tests/test_*.mojo, or the given files
test = "bash tests/run_all.sh"
examples = "bash examples/run_all.sh"
package = "mkdir -p build && mojo precompile proptest -o build/proptest.mojoc"
format = "mojo format proptest tests examples extras"
# NuMojo strategies (extras/proptest_numojo); see extras/run_tests.sh
test-numojo = "bash extras/run_tests.sh"

[dependencies]
mojo = ">=1.3.0.dev2026110305,<2"
